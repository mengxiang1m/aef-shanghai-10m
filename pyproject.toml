[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aef-shanghai"
version = "0.1.0"
description = "A lightweight AlphaEarth Foundations inspired workflow for aligned 10 m Shanghai rasters"
requires-python = ">=3.10"
dependencies = [
  "einops>=0.7",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
geo = ["rasterio>=1.3"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
